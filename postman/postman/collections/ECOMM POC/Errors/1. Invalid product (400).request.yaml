$kind: http-request
description: Breaks several validation rules at once; fieldErrors lists one entry per field, sorted by field name.
url: "{{baseUrl}}/api/v1/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sku": "bad",
      "name": "   ",
      "price": "-1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test("Code is VALIDATION_FAILED", () => pm.expect(body.code).to.eql("VALIDATION_FAILED"));
      pm.test("Field errors for name, price and sku", () =>
        pm.expect(body.fieldErrors.map(f => f.field)).to.eql(["name", "price", "sku"]));
      pm.test("Same messages as the other app", () =>
        pm.expect(body.fieldErrors.map(f => f.message)).to.eql([
          "must not be blank",
          "must be greater than 0",
          "must look like ABC-123 (3 capital letters, a dash, digits)"
        ]));
    language: text/javascript
order: 1000
