$kind: http-request
description: size is limited to 100; anything larger is a validation error, not silently clamped.
url: "{{baseUrl}}/api/v1/products?size=101"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test("Code is VALIDATION_FAILED", () => pm.expect(body.code).to.eql("VALIDATION_FAILED"));
      pm.test("Field error on size", () =>
        pm.expect(body.fieldErrors).to.eql([{ field: "size", message: "must be less than or equal to 100" }]));
    language: text/javascript
order: 2000
