$kind: http-request
description: ""
url: "{{baseUrl}}/api/v1/products"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Body is a page", () => pm.expect(body).to.have.all.keys("items", "page", "size", "totalItems", "totalPages"));
      pm.test("Items is a list", () => pm.expect(body.items).to.be.an("array"));
    language: text/javascript
order: 1000
