$kind: http-request
description: ""
url: "{{baseUrl}}/api/v1/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Same SKU", () => pm.expect(pm.response.json().sku).to.eql(pm.environment.get("sku")));
    language: text/javascript
order: 4000
